[project]
name = "backend-restful-api"
version = "0.1.0"
description = "FastAPI 기반 RESTful 게시판 API (JWT 인증·인가, PostgreSQL, SQLAlchemy)"
readme = "README.md"
authors = [
    { name = "조성아", email = "agnus.oj14@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.163.1",
    "greenlet>=3.5.6",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
